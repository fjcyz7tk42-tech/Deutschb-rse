server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hub API: /api/companies -> http://hub-api:8000/companies
    location /api/ {
        proxy_pass http://hub-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # impact cards may wait for the AI summary
        proxy_read_timeout 60s;
    }

    # Live feed: /live/events -> http://live:8000/events
    location /live/ {
        proxy_pass http://live:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # hashed build assets can be cached for long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # single-page app: deep links (#CBK/2026-02-11) all load index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
