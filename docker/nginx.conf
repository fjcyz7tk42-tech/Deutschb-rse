# Caddy (or a platform TLS proxy) supplies the original scheme. Direct local
# requests have no forwarded scheme and keep using HTTP.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Keep nginx's slash redirects on the browser's original HTTPS origin.
    absolute_redirect off;

    # Hub API: /api/companies -> http://hub-api:8000/companies
    location /api/ {
        proxy_pass http://hub-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        # impact cards may wait for the AI summary
        proxy_read_timeout 60s;
    }

    # Live feed: /live/events -> http://live:8000/events
    location /live/ {
        proxy_pass http://live:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 30s;
    }

    # hashed build assets can be cached for long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # single-page app: deep links (#CBK/2026-02-11) all load index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
