# IssuerLens: Hub API + frontend.
#   docker compose up --build        -> http://localhost:8080   (alert mails: http://localhost:8025)
# Public server: add -f docker-compose.http.yml (plain HTTP on port 80), -f docker-compose.https.yml (Caddy)
# or -f docker-compose.tunnel.yml (Cloudflare); scripts/server-setup.sh picks one (see README).
# Hub API code, config and Parquet seed live in hub/; the seed is not in git (copy it, see README).
name: issuer-hub

services:
  hub-api:
    build:
      context: .
      dockerfile: docker/hub-api.Dockerfile
    environment:
      DB_PATH: data/hub.duckdb
      # AI summary on the impact card, from .env; without it the card shows the template text
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8001:8000"   # direct API access (docs: http://localhost:8001/docs)
    restart: unless-stopped

  live:
    # polls EQS News (every 2 min) and tagesschau.de business news (every 5 min); run only ONE poller
    build:
      context: .
      dockerfile: docker/live.Dockerfile
    environment:
      HUB_API_URL: http://hub-api:8000
      EQS_INTERVAL_S: "120"
      TAGESSCHAU_INTERVAL_S: "300"
      # mail alerts: by default into Mailpit (nothing leaves the machine); real SMTP via .env, see .env.example
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@issuer-hub.local}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ALERT_MAX_AGE_H: ${ALERT_MAX_AGE_H:-6}
    volumes:
      - live-data:/app/live-data   # SQLite feed database and raw responses
    ports:
      - "8003:8000"   # also used by the local dev frontend (npm run dev)
    depends_on:
      hub-api:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    # catches the alert mails for the demo and shows them in a web UI; unused once SMTP_HOST points elsewhere
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"   # web UI
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      # optional site password (docker/40-basic-auth.sh); empty = open, fine on localhost
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - "8080:80"
    depends_on:
      hub-api:
        condition: service_healthy
      live:
        condition: service_started
    restart: unless-stopped

volumes:
  live-data:
